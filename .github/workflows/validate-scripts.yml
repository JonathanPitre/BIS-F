name: Validate Scripts

on:
  pull_request:
    paths:
      - "Framework/**"
      - "tools/**"
      - ".vscode/PSScriptAnalyzerSettings.psd1"
      - ".editorconfig"
      - ".github/tool-versions.env"
      - ".github/workflows/validate-scripts.yml"
      - "**/*.ps1"
      - "**/*.psm1"
      - "**/*.psd1"
  push:
    branches: [master, main, develop, refactor/modernize]
    paths:
      - "Framework/**"
      - "tools/**"
      - ".vscode/PSScriptAnalyzerSettings.psd1"
      - ".editorconfig"
      - ".github/tool-versions.env"
      - ".github/workflows/validate-scripts.yml"
      - "**/*.ps1"
      - "**/*.psm1"
      - "**/*.psd1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-scripts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  psscriptanalyzer:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Load tool versions
        shell: pwsh
        run: |
          Get-Content .github/tool-versions.env |
            Where-Object { $_ -and ($_ -notmatch '^\s*#') } |
            ForEach-Object { Add-Content -Path $env:GITHUB_ENV -Value $_.Trim() }

      - name: Cache PSScriptAnalyzer module
        uses: actions/cache@v6
        with:
          path: ${{ env.USERPROFILE }}\Documents\PowerShell\Modules\PSScriptAnalyzer
          key: psscriptanalyzer-${{ env.PSSCRIPTANALYZER_VERSION }}-${{ runner.os }}

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          & ./tools/Invoke-BISFScriptAnalyzer.ps1 -Severity Error

  variable-casing:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          git fetch --no-tags --prune origin "refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Check variable PascalCase (changed files)
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          & ./tools/Test-BISFVariableCasing.ps1 -ChangedOnly -BaseRef "origin/${{ github.base_ref }}"

      - name: Check variable PascalCase (full Framework)
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          & ./tools/Test-BISFVariableCasing.ps1

  utf8-bom:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check UTF-8 BOM (fail on PR / dispatch)
        if: github.event_name != 'push'
        shell: pwsh
        run: |
          & ./tools/Test-BISFUtf8Bom.ps1

      - name: Fix UTF-8 BOM (push to default branches)
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          & ./tools/Test-BISFUtf8Bom.ps1 -Fix

      - name: Commit BOM fixes
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "fix: ensure PowerShell scripts use UTF-8 with BOM"
          file_pattern: "*.ps1 *.psm1 *.psd1"
